server.port=7777
logging.config=classpath:logback-cicd.xml

# Minimal server profile for the CI/CD demonstration. MySQL and Redis use the
# Docker Compose service names from deploy/compose.yml. Passwords come from the
# server's untracked .env file through environment variables.
austin.mq.pipeline=eventBus
austin.nacos.enabled=false
austin.apollo.enabled=false
austin.rule.engine.enabled=false
austin.xxl.job.enabled=false
austin.login.official.account.enable=false
austin.business.upload.crowd.path=/data/upload
austin.graylog=127.0.0.1

# Use the Docker Compose service names, independent of the WSL IP.
austin.database.ip=mysql
austin.redis.ip=redis

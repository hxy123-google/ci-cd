name: Deploy or roll back

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing Harbor tag, for example sha-<40-character commit>'
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: [self-hosted, linux, x64, austin-lab]
    timeout-minutes: 15
    environment: production
    concurrency:
      group: austin-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Validate requested image
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
        run: |
          [[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]] || { echo 'Use a full commit SHA image tag' >&2; exit 2; }
          [[ "$HARBOR_REGISTRY" =~ ^[a-z0-9][a-z0-9.-]*(:[0-9]{1,5})?$ ]] || { echo 'Set HARBOR_REGISTRY to a Harbor hostname' >&2; exit 2; }
          [[ "$HARBOR_PROJECT" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo 'Set HARBOR_PROJECT to a lowercase Harbor project' >&2; exit 2; }
          echo "IMAGE=${HARBOR_REGISTRY}/${HARBOR_PROJECT}/austin:${IMAGE_TAG}" >> "$GITHUB_ENV"
      - name: Install deployment files in WSL
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/austin-cicd/schema"
          install -m 644 deploy/compose.yml "$HOME/austin-cicd/compose.yml"
          install -m 755 deploy/deploy.sh "$HOME/austin-cicd/deploy.sh"
          install -m 644 doc/sql/austin.sql "$HOME/austin-cicd/schema/austin.sql"
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_PULL_USERNAME }}
          password: ${{ secrets.HARBOR_PULL_PASSWORD }}
      - name: Deploy and verify health
        shell: bash
        run: bash "$HOME/austin-cicd/deploy.sh" "$IMAGE"

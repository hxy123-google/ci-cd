name: CI and publish image

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Simulate deployment and automatic rollback
        run: bash deploy/test-deploy.sh
      - name: Package the web application
        run: mvn -B -ntp -pl austin-web -am package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: austin-web-jar
          path: austin-web/target/austin-web-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && vars.HARBOR_REGISTRY != '' && vars.HARBOR_PROJECT != ''
    needs: verify
    runs-on: [self-hosted, linux, x64, austin-lab]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: austin-web-jar
          path: austin-web/target
      - name: Validate Harbor address
        shell: bash
        env:
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
        run: |
          [[ "$HARBOR_REGISTRY" =~ ^[a-z0-9][a-z0-9.-]*(:[0-9]{1,5})?$ ]] || { echo 'HARBOR_REGISTRY must be a hostname, optionally with a port, without https://' >&2; exit 2; }
          [[ "$HARBOR_PROJECT" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo 'HARBOR_PROJECT must be a lowercase project name' >&2; exit 2; }
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_PUSH_USERNAME }}
          password: ${{ secrets.HARBOR_PUSH_PASSWORD }}
      - name: Build and push commit-tagged image
        shell: bash
        env:
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
        run: |
          image="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/austin:sha-${GITHUB_SHA}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Image already exists; keeping the existing commit tag: $image"
            exit 0
          fi
          docker build --pull --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -t "$image" .
          docker push "$image"
          echo "Published $image"

  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: sha-${{ github.sha }}
    secrets: inherit
